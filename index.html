<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-ZUG</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;padding:16px;max-width:480px}
input,a{display:block;width:100%;box-sizing:border-box;min-height:56px;margin-bottom:8px;
  border-radius:4px;text-decoration:none}
input{padding:0 12px;border:1px solid #999;font-family:ui-monospace,monospace;
  font-size:22px;letter-spacing:.05em}
a{line-height:56px;text-align:center;font-size:17px}
#open{background:#000;color:#fff}
#open[aria-disabled=true]{background:#ccc;color:#666;pointer-events:none}
#scan{border:1px solid #999;color:#000}
</style>
</head>
<body>
<input id="sn" inputmode="numeric" autocomplete="off" placeholder="Seriennummer" aria-label="Seriennummer">
<a id="open" href="#">Bei V-ZUG öffnen</a>
<a id="scan" href="#">Scannen</a>

<script>
var REGION = 'ch/de';   // z.B. 'ch/fr', 'de/de'
var LEN    = 11;        // Länge der Seriennummer

function normalize(x) {
  var d = String(x || '').replace(/\D/g, '');
  return d.length < LEN ? null : d.slice(-LEN);
}

var field = document.getElementById('sn');
var open  = document.getElementById('open');

document.getElementById('scan').href =
  'binaryeye://scan?ret=' +
  encodeURIComponent(location.origin + location.pathname + '?sn=') + '{RESULT}';

function refresh() {
  var sn = normalize(field.value);
  if (sn) {
    open.href = 'https://www.vzug.com/' + REGION + '/device-information?serialNumber=' + sn;
    open.removeAttribute('aria-disabled');
  } else {
    open.href = '#';
    open.setAttribute('aria-disabled', 'true');
  }
}

// Gescannter Wert landet im Feld, gekürzt auf die letzten LEN Ziffern.
// Liess sich nichts kürzen, kommen die Rohziffern rein, damit man korrigieren kann.
var raw = new URLSearchParams(location.search).get('sn');
if (raw !== null) field.value = normalize(raw) || raw.replace(/\D/g, '');

field.addEventListener('input', refresh);
refresh();
</script>
</body>
</html>
