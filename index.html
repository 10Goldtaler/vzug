<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V-ZUG Typenschild</title>
<meta name="theme-color" content="#0E1013">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230E1013'/><rect x='6' y='12' width='20' height='8' rx='1' fill='%23FFC93C'/></svg>">
<style>
  :root{
    --bg:#0E1013;
    --plate:#191D22;
    --etch:#2B323A;
    --ink:#ECEFF3;
    --mute:#8B959F;
    --signal:#FFC93C;
    --alarm:#FF6B54;
    --sans:ui-sans-serif,"Inter","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;justify-content:center;
    padding:24px max(24px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  main{width:100%;max-width:420px;margin:0 auto}

  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mute);margin:0 0 18px;
  }

  /* the plate: echoes the engraved label on the appliance */
  .plate{
    background:var(--plate);border:1px solid var(--etch);border-radius:3px;
    padding:18px 20px;position:relative;
  }
  .plate::before,.plate::after{
    content:"";position:absolute;width:5px;height:5px;border-radius:50%;
    background:var(--etch);top:8px;
  }
  .plate::before{left:8px}
  .plate::after{right:8px}
  .plate-label{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);
    margin-bottom:6px;
  }
  .sn{
    font-family:var(--mono);font-size:30px;letter-spacing:.04em;
    display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  }
  .sn .device{color:var(--mute)}
  .split{
    display:flex;gap:12px;margin-top:10px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  }
  .split span:first-child{width:5.6ch}

  .status{margin:20px 0 0;font-size:14px;line-height:1.5;color:var(--mute)}
  .status strong{color:var(--ink);font-weight:600}
  .status.bad{color:var(--alarm)}

  .actions{margin-top:28px;display:flex;flex-direction:column;gap:10px}
  a.btn,button.btn{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:60px;border-radius:4px;text-decoration:none;
    font-size:16px;font-weight:600;font-family:inherit;letter-spacing:.01em;
    transition:transform .12s ease,background .12s ease;
  }
  a.btn:active,button.btn:active{transform:scale(.985)}
  .primary{background:var(--signal);color:#0E1013}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--etch)}
  .btn:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

  form{display:flex;gap:8px;margin-top:10px}
  input{
    flex:1;min-width:0;min-height:60px;padding:0 16px;
    background:var(--plate);border:1px solid var(--etch);border-radius:4px;
    color:var(--ink);font-family:var(--mono);font-size:18px;letter-spacing:.05em;
  }
  input::placeholder{color:#5D6771;letter-spacing:.04em}
  input:focus{outline:none;border-color:var(--signal)}
  form button{padding:0 20px;min-height:60px;border-radius:4px;border:0;
    background:var(--etch);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600}

  .hint{margin-top:22px;font-size:12px;line-height:1.6;color:#67717B}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="eyebrow" id="eyebrow">Seriennummer scannen</p>
  <div id="view"></div>
</main>

<script>
(function () {
  // ---- Konfiguration ------------------------------------------------------
  var REGION   = 'ch/de';          // z.B. 'ch/fr', 'de/de'
  var SN_LEN   = 11;               // 5-stellige Modellnr. + 6-stellige Gerätenr.
  var DELAY_MS = 700;              // Anzeigedauer vor der Weiterleitung

  var BASE = location.origin + location.pathname;
  var view = document.getElementById('view');
  var eyebrow = document.getElementById('eyebrow');

  // ---- Normalisierung -----------------------------------------------------
  // Der 2D-Code liefert mehr Stellen als die Website akzeptiert (Präfix).
  // Statt fix zwei Zeichen abzuschneiden: alle Ziffern nehmen, hinten 11 behalten.
  function normalize(raw) {
    var digits = String(raw || '').replace(/\D/g, '');
    if (digits.length < SN_LEN) return null;
    return digits.slice(-SN_LEN);
  }

  function deviceUrl(sn) {
    return 'https://www.vzug.com/' + REGION + '/device-information?serialNumber=' + sn;
  }

  function scanUrl() {
    // Binary Eye schickt das Ergebnis an diese Seite zurück.
    // {RESULT} bleibt bewusst unkodiert – so verlangt es die App.
    return 'binaryeye://scan?ret=' + encodeURIComponent(BASE + '?sn=') + '{RESULT}';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---- Ansichten ----------------------------------------------------------
  function showStart(message) {
    eyebrow.textContent = 'Seriennummer scannen';
    view.innerHTML =
      '<a class="btn primary" href="' + esc(scanUrl()) + '">Typenschild scannen</a>' +
      '<form id="manual" novalidate>' +
        '<input id="sn" inputmode="numeric" autocomplete="off" placeholder="41095 032966" aria-label="Seriennummer eingeben">' +
        '<button type="submit">Los</button>' +
      '</form>' +
      (message ? '<p class="status bad">' + esc(message) + '</p>' : '') +
      '<p class="hint">Kein Code auf dem Schild? Nummer von Hand eintippen – ' +
      'Leerzeichen und Präfixe sind egal.</p>';

    document.getElementById('manual').addEventListener('submit', function (e) {
      e.preventDefault();
      var sn = normalize(document.getElementById('sn').value);
      if (!sn) { showStart('Das sind zu wenig Ziffern. Die Seriennummer hat ' + SN_LEN + '.'); return; }
      go(sn);
    });
  }

  function showPlate(sn) {
    eyebrow.textContent = 'Gerät erkannt';
    view.innerHTML =
      '<div class="plate">' +
        '<div class="plate-label">Serialnummer</div>' +
        '<div class="sn"><span>' + sn.slice(0, 5) + '</span>' +
        '<span class="device">' + sn.slice(5) + '</span></div>' +
        '<div class="split"><span>Modell</span><span>Gerät</span></div>' +
      '</div>' +
      '<p class="status">V-ZUG wird geöffnet …</p>' +
      '<div class="actions">' +
        '<a class="btn ghost" href="' + esc(deviceUrl(sn)) + '">Jetzt öffnen</a>' +
      '</div>';
  }

  function go(sn) {
    showPlate(sn);
    setTimeout(function () { location.replace(deviceUrl(sn)); }, DELAY_MS);
  }

  // ---- Einstieg -----------------------------------------------------------
  var params = new URLSearchParams(location.search);
  var raw = params.get('sn') || params.get('code');

  if (raw === null) {
    showStart();
  } else {
    var sn = normalize(raw);
    if (sn) {
      go(sn);
    } else {
      showStart('Im Code steckt keine Seriennummer: „' + raw.slice(0, 40) + '“');
    }
  }
})();
</script>
</body>
</html>
